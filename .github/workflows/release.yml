name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: Linux arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: macOS arm64
            os: macos-15
            target: aarch64-apple-darwin
          - name: macOS x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-${GITHUB_SHA::7}"
          fi
          # A tag may contain '/', which is not valid in an archive path.
          version="${version//\//-}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Sync workspace version with tag
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Rewrite only the [workspace.package] version; leave every other
          # `version` key (dependencies) untouched.
          awk -v ver="$VERSION" '
            /^\[workspace\.package\]/ { in_pkg = 1 }
            in_pkg && /^version[[:space:]]*=/ {
              sub(/version[[:space:]]*=.*/, "version = \"" ver "\"")
              in_pkg = 0
            }
            { print }
          ' Cargo.toml > Cargo.toml.tmp
          mv Cargo.toml.tmp Cargo.toml
          # Keep Cargo.lock in sync so `cargo build --locked` still works.
          cargo update --workspace
          grep -A1 '^\[workspace\.package\]' Cargo.toml

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked -p cli --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          name="devkit-mcp-${VERSION}-${{ matrix.target }}"
          staging="staging/${name}"
          mkdir -p "$staging" out
          cp "target/${{ matrix.target }}/release/devkit-mcp" "$staging/"
          cp README.md LICENSE "$staging/"
          tar -C staging -czf "out/${name}.tar.gz" "${name}"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $name = "devkit-mcp-$env:VERSION-${{ matrix.target }}"
          $staging = "staging/$name"
          New-Item -ItemType Directory -Force -Path $staging, "out" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/devkit-mcp.exe" "$staging/"
          Copy-Item README.md, LICENSE "$staging/"
          Compress-Archive -Path $staging -DestinationPath "out/$name.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: devkit-mcp-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
